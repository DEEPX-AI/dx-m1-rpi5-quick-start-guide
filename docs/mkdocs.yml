site_name: DEEPX DX-M1 & DX-M1M Quick User Manual for Raspberry Pi 5
use_directory_urls: false
docs_dir: source # markdown 원문 폴더
site_dir: docs # html로 변환된 폴더
theme: 
  name : material
  language: en
  font:
    text: Noto Sans Display
    #text: Noto Serif
    #code: Noto Sans 
    code: Roboto Mono 
  logo: img/deepx.png
  #favicon: img/favicon.png
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: black
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
     - toc.integrate
     - content.code.annotate
     - navigation.tabs
     - navigation.tabs.sticky
     - content.tabs.link
     - content.code.copy
site_url: 'https://developer.deepx.ai/'
nav:
  - Introduction: 01_Introduction.md
  - System Overview: 02_System_Overview.md
  - Getting Started: 03_Getting_Started.md
  - Appendix. Troubleshooting: 04_Appendix.md

plugins:
  - search
  - include-markdown
  - to-pdf:
      author: DEEPX.ai
      copyright: ⓒ Copyright 2026 DEEPX All Rights Reserved.
      cover_title: DEEPX DX-M1 & DX-M1M Quick User Manual for Raspberry Pi 5
      cover_subtitle: 2026/11/06 (v1.3.0)
      cover_logo : img/deepx.png
      custom_template_path: source/stylesheets
      output_path: ../DEEPX_DX-M1_M1M_Quick_UM_Raspberry_Pi_5_v1.3.0_NOV_2026.pdf

extra:
  homepage: https://developer.deepx.ai
  generator: false
  social:
     - icon: fontawesome/brands/linkedin
       link: https://www.linkedin.com/company/deepx-corporation/
extra_css: 
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - def_list
  - toc:
        permalink: "true"
        baselevel: 1
        separator: ">_"
        toc_depth: 3
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true 
  - attr_list
  - md_in_html
copyright: ⓒ Copyright 2026 <a href="http://deepx.ai">DEEPX</a>. All Rights Reserved.
